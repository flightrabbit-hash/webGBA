<!doctype html>
<html lang="ko" data-theme="dark" data-tone="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="webGBA" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="webGBA — GBA player in the browser. No ROMs included." />
    <title>webGBA</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--boot-bg, #070a14);
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: var(--boot-bg, #070a14);
        transition: opacity 0.2s ease-out;
      }
      #boot.is-done {
        opacity: 0;
      }
      #boot img {
        width: 96px;
        height: 96px;
        image-rendering: pixelated;
      }
      #boot i {
        position: relative;
        display: block;
        width: 48px;
        height: 6px;
        overflow: hidden;
        background: rgba(128, 140, 170, 0.35);
      }
      #boot i::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 16px;
        height: 6px;
        background: #6c93ff;
        animation: boot-step 0.9s steps(3) infinite;
      }
      @keyframes boot-step {
        to {
          transform: translateX(48px);
        }
      }
      body[data-booting] .app,
      body[data-booting] .gate {
        visibility: hidden;
      }
      @media (prefers-reduced-motion: reduce) {
        #boot i::after {
          animation: none;
        }
      }
    </style>
    <script>
      (() => {
        try {
          const color = localStorage.getItem("webgba.bootBg");
          if (/^#[0-9a-f]{3,8}$|^rgb/i.test(color || "")) document.documentElement.style.setProperty("--boot-bg", color);
        } catch {}
      })();
    </script>
    <link rel="stylesheet" href="/css/web.css" />
    <script type="module" src="/js/main.js"></script>
  </head>
  <body data-layout="portrait" data-pad="off" data-view="start" data-booting>
    <div id="boot" aria-hidden="true"><img src="/icons/icon-192.png" alt="" width="96" height="96" /><i></i></div>
    <div class="app" id="app">
      <header class="bar" id="bar">
        <button class="tool tool--menu" id="btnMenu" type="button" data-i18n-title="title.menu" data-i18n-aria="title.menu" aria-expanded="false"></button>
        <div class="bar__group bar__group--files">
          <button class="tool" id="btnOpen" type="button" data-i18n-title="web.open" data-i18n-aria="web.open"></button>
          <button class="tool" id="btnLibrary" type="button" data-i18n-title="web.library" data-i18n-aria="web.library"></button>
          <button class="tool" id="btnSaves" type="button" data-i18n-title="web.saves" data-i18n-aria="web.saves"></button>
        </div>
        <div class="bar__group">
          <button class="tool" id="btnFast" type="button" data-i18n-title="web.speed" data-i18n-aria="web.speed" aria-pressed="false"></button>
          <button class="tool" id="btnSound" type="button" data-i18n-title="rail.mute" data-i18n-aria="rail.mute" aria-pressed="false"></button>
          <button class="tool" id="btnSettings" type="button" data-i18n-title="cfg.title" data-i18n-aria="cfg.title"></button>
          <button class="tool" id="btnFull" type="button" data-i18n-title="web.fullscreen" data-i18n-aria="web.fullscreen" hidden></button>
        </div>
      </header>

      <main class="stage" id="stage">
        <canvas class="frame" id="frame" aria-hidden="true"></canvas>
        <div class="screen" id="screen">
          <canvas id="canvas" width="240" height="160" tabindex="-1"></canvas>
          <div class="start" id="start">
            <div class="start__head">
              <p class="start__hint" id="startHint"></p>
              <button class="btn btn--primary" id="startOpen" type="button"><span class="icon" style="--icon: url('/icons/folder-open.svg')"></span><span class="btn__label" data-i18n="web.openShort"></span></button>
            </div>
            <ul class="list start__list" id="startList" hidden></ul>
            <p class="start__note" data-i18n="web.privacy"></p>
          </div>
          <div class="veil" id="pauseVeil" hidden>
            <p class="veil__title" data-i18n="stage.paused"></p>
            <div class="veil__actions">
              <button class="btn btn--primary" id="veilResume" type="button"><span class="icon" style="--icon: url('/icons/player-play.svg')"></span><span data-i18n="menu.resume"></span></button>
              <button class="btn" id="veilReset" type="button"><span class="icon" style="--icon: url('/icons/refresh.svg')"></span><span data-i18n="menu.reset"></span></button>
              <button class="btn" id="veilClose" type="button"><span class="icon" style="--icon: url('/icons/x.svg')"></span><span data-i18n="web.closeGame"></span></button>
            </div>
          </div>
          <p class="toast" id="toast" role="status" aria-live="polite" hidden></p>
        </div>
      </main>

      <section class="pad" id="pad" aria-hidden="true">
        <div class="zone zone--left"></div>
        <div class="zone zone--right"></div>
        <div class="key key--l" data-key="L"></div>
        <div class="key key--r" data-key="R"></div>
        <div class="dpad" data-dpad data-mode="stick"></div>
        <div class="face">
          <div class="key key--b" data-key="B"></div>
          <div class="key key--a" data-key="A"></div>
        </div>
        <div class="key key--select" data-key="SELECT"></div>
        <div class="key key--start" data-key="START"></div>
      </section>
    </div>

    <div class="sheet" id="sheet" hidden>
      <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <header class="sheet__head">
          <h2 class="sheet__title" id="sheetTitle"></h2>
          <button class="tool tool--small" id="sheetClose" type="button" data-i18n-title="win.close" data-i18n-aria="win.close"><span class="icon" style="--icon: url('/icons/x.svg')"></span></button>
        </header>
        <div class="sheet__body" id="sheetBody"></div>
      </div>
    </div>

    <div class="dialog" id="dialog" hidden>
      <div class="dialog__card" role="alertdialog" aria-modal="true" aria-labelledby="dialogTitle">
        <h3 class="dialog__title" id="dialogTitle"></h3>
        <div class="dialog__body" id="dialogBody"></div>
        <div class="dialog__actions" id="dialogActions"></div>
      </div>
    </div>

    <div class="gate" id="gate" hidden></div>
    <div class="drop" id="drop" hidden><p class="drop__card" data-i18n="drop.card"></p></div>
    <div class="notice" id="notice" hidden>
      <span class="notice__text" id="noticeText"></span>
      <button class="btn btn--primary btn--small" id="noticeGo" type="button"></button>
    </div>
  </body>
</html>
