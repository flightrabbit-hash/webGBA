# webGBA 설정
#
# 이 파일은 webGBA 를 다시 켜면 반영됩니다.

#WINDOW
# 처음 열 때 창 크기(픽셀). 지난번에 닫은 위치·크기가 있으면 그것이 먼저입니다.
appWidth: 960
appHeight: 720
appMinWidth: 520
appMinHeight: 420

#GAME
# pauseWhenHidden 을 true 로 설정하면 창을 최소화하거나 다른 창으로 옮겼을 때 게임을 멈춥니다.
pauseWhenHidden: false

#DEVELOP
# useDevelopKit 을 true 로 설정하면 개발자 도구(Ctrl+Shift+I)와 오른쪽 클릭 메뉴를 씁니다.
useDevelopKit: false
